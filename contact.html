<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contactez BILL TFC & Mémoires pour un accompagnement académique." />
    <title>Contact | BILL TFC & Mémoires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/translations.js"></script>
    <script defer src="js/main.js"></script>
  </head>
  <body>
    <header class="site-header" data-role="site-header"></header>

    <main class="page-shell">
      <div class="container page-header">
        <p class="section-kicker">Contact</p>
        <h1 data-i18n-key="contact.pageTitle">Nous contacter</h1>
      </div>

      <div class="container">
        <div class="contact-grid">
          <a class="contact-card" href="https://wa.me/243997236789" target="_blank" rel="noopener">
            <span class="meta" data-i18n-key="contact.cardWhatsApp">WhatsApp</span>
            <strong>+243 99 72 36 789</strong>
            <span class="link-text" data-i18n-key="contact.direct">Contact direct</span>
          </a>

          <a class="contact-card" href="mailto:billdollars965@gmail.com">
            <span class="meta" data-i18n-key="contact.cardEmail">Email</span>
            <strong>billdollars965@gmail.com</strong>
            <span class="link-text" data-i18n-key="contact.sendEmail">Envoyez un message</span>
          </a>

          <div class="contact-card">
            <span class="meta" data-i18n-key="contact.cardAvailability">Disponibilité</span>
            <strong data-i18n-key="contact.availability">Disponible 24h/24, 7j/7</strong>
            <span class="link-text">À vos côtés, à chaque étape.</span>
          </div>
        </div>

        <div class="contact-form-wrap">
          <h2 data-i18n-key="contact.formTitle">Envoyez un message</h2>
          <form class="contact-form" data-page-form>
            <label>
              <span data-i18n-key="contact.name">Nom</span>
              <input type="text" name="name" placeholder="Nom" />
            </label>
            <label>
              <span data-i18n-key="contact.email">Email</span>
              <input type="email" name="email" placeholder="Email" />
            </label>
            <label>
              <span data-i18n-key="contact.message">Message</span>
              <textarea name="message" placeholder="Message"></textarea>
            </label>
            <button type="submit" class="btn btn-primary" data-i18n-key="contact.send">Envoyer par email</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer" data-role="site-footer"></footer>
  </body>
</html>
